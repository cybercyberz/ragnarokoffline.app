# Population Engine -- Companion Summoner builds
#
# What a companion hired from the Companions window wears, and how its stat
# points are spent. One entry per job family, duty, quality and level band:
#
#   Job:      Summoner family key (knight, assassin, hunter, wizard, monk,
#             blacksmith, rogue, gunslinger, ninja, stargladiator, crusader,
#             bard, dancer, soullinker, sage, priest). Covers both the 2nd job
#             and its transcendent job.
#   Duty:     attacker | defender | support1 | support2
#   Quality:  excellent | good | standard
#   MinLevel: The entry applies from this base level up; the highest band not
#             above the companion's level wins. (Default: 1)
#   Stats:    Stat targets in priority order. Points are spent the way a
#             player's are, first stat first, at the real per-point cost.
#   Rest:     Stat that takes whatever is left. (Default: Vit)
#   Equip:    Items by AegisName or id. Refine and Cards are optional. An item
#             the job or level cannot wear is dropped, with a warning in the
#             map-server log, not forced on.
#
# With no entry for a job/duty/quality the companion keeps the gear of its
# population_engine.yml profile and a built-in stat plan.
#
# Generated by RoOffline tools/build_companion_builds.py; entries below are
# the hand-written seed it replaces.

Header:
  Type: POPULATION_COMPANION_BUILD_DB
  Version: 1

